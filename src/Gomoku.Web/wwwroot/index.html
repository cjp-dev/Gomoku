<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gomoku .NET – Play Five in a Row Online</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: Segoe UI, sans-serif; color: #eceff1; background-color: #1e2426;">
            <div style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem;">Gomoku .NET</div>
            <div style="font-size: 0.95rem; color: #90a4ae;">Loading engine and opening book...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/gomoku.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
