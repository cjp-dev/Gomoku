name: Deploy web version

on:
  push:
    branches: [ main, feature/web-multithreading-v2-plan ]
    paths:
      - 'src/Gomoku.Web/**'
      - 'src/Gomoku.Web.Engine/**'
      - 'src/Gomoku.App/**'
      - 'src/Gomoku.Core/**'
      - 'docs/brain/**'
      - 'Images/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Publish Engine (Threaded WASM + AOT)
        run: dotnet publish src/Gomoku.Web.Engine/Gomoku.Web.Engine.csproj -c Release -p:RunAOTCompilation=true -o engine_publish

      - name: Publish Web App (Single-threaded UI)
        run: dotnet publish src/Gomoku.Web/Gomoku.Web.csproj -c Release -o publish

      - name: Copy Engine Assets to Web App
        run: |
          mkdir -p publish/wwwroot/engine/_framework
          cp -r engine_publish/wwwroot/_framework/* publish/wwwroot/engine/_framework/

      # The app is already built, so the action only uploads the static files.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
