<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2125"/>
      <stop offset="100%" stop-color="#12171A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64B5F6"/>
    </marker>
  </defs>

  <rect width="820" height="420" rx="12" fill="url(#bg)" stroke="#2E3B43" stroke-width="2"/>
  <text x="410" y="34" text-anchor="middle" fill="#ECEFF1" font-size="18" font-weight="700">Gomoku .NET — Clean Architecture &amp; Dependency Flow</text>

  <!-- Presentation Layer -->
