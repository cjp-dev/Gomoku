  <text x="640" y="223" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">GameShell</text>
  <text x="640" y="241" text-anchor="middle" fill="#E1BEE7" font-size="10">Shared GUI (submodule)</text>

