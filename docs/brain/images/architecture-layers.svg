  <rect x="64" y="88" width="158" height="48" rx="6" fill="#2B3742" stroke="#EF5350" stroke-width="1.5"/>
  <text x="143" y="110" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Gomoku.Wpf</text>
  <text x="143" y="127" text-anchor="middle" fill="#B0BEC5" font-size="10">net10.0-windows • WPF</text>

  <rect x="242" y="88" width="158" height="48" rx="6" fill="#2B3742" stroke="#EF5350" stroke-width="1.5"/>
  <text x="321" y="110" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Gomoku.Web.Engine</text>
  <text x="321" y="127" text-anchor="middle" fill="#B0BEC5" font-size="10">Threaded WASM engine</text>

  <rect x="420" y="88" width="158" height="48" rx="6" fill="#2B3742" stroke="#EF5350" stroke-width="1.5"/>
  <text x="499" y="110" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Gomoku.Web</text>
  <text x="499" y="127" text-anchor="middle" fill="#B0BEC5" font-size="10">Blazor WASM AOT</text>

  <rect x="598" y="88" width="158" height="48" rx="6" fill="#2B3742" stroke="#FFA726" stroke-width="1.5"/>
  <text x="677" y="110" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Gomoku.Benchmark</text>
  <text x="677" y="127" text-anchor="middle" fill="#B0BEC5" font-size="10">CLI profiler &amp; match runner</text>

  <!-- Application Layer -->
  <rect x="40" y="182" width="495" height="86" rx="8" fill="#1F2933" stroke="#66BB6A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="56" y="202" fill="#A5D6A7" font-size="12" font-weight="600">SHARED APPLICATION LAYER (MVVM)</text>

  <rect x="64" y="212" width="447" height="44" rx="6" fill="#26392F" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="287" y="232" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">Gomoku.App</text>
  <text x="287" y="248" text-anchor="middle" fill="#C8E6C9" font-size="11">MainViewModel • SettingsViewModel • AnalysisViewModel • SoundWaves • Service Interfaces</text>

