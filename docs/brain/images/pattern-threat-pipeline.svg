<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4FC3F7"/>
    </marker>
  </defs>
  <rect width="860" height="320" rx="12" fill="#141A1D" stroke="#2E3B43" stroke-width="2"/>
  <text x="430" y="32" text-anchor="middle" fill="#ECEFF1" font-size="18" font-weight="700">Carbon O(1) Pattern Recognition &amp; Threat Classification Pipeline</text>

  <!-- Stage 1 -->
  <rect x="28" y="64" width="180" height="190" rx="8" fill="#1E2930" stroke="#4FC3F7" stroke-width="1.5"/>
  <text x="118" y="88" text-anchor="middle" fill="#4FC3F7" font-size="14" font-weight="700">1. Ray Bitmasks</text>
  <text x="118" y="108" text-anchor="middle" fill="#B0BEC5" font-size="11">pattern[k][0..1] (8-bit)</text>
  <text x="42" y="136" fill="#ECEFF1" font-size="11">• 4 axes: —, |, \, /</text>
  <text x="42" y="156" fill="#ECEFF1" font-size="11">• Bits 0..3: −4..−1</text>
  <text x="42" y="176" fill="#ECEFF1" font-size="11">• Bits 4..7: +1..+4</text>
  <text x="42" y="200" fill="#81C784" font-size="11">• Updated in O(1) via</text>
  <text x="52" y="216" fill="#81C784" font-size="11">bitwise OR / XOR</text>

  <!-- Stage 2 -->
  <rect x="242" y="64" width="180" height="190" rx="8" fill="#1E2930" stroke="#AED581" stroke-width="1.5"/>
  <text x="332" y="88" text-anchor="middle" fill="#AED581" font-size="14" font-weight="700">2. STATUS1[256][256]</text>
  <text x="332" y="108" text-anchor="middle" fill="#B0BEC5" font-size="11">1D Line Threat (0..9)</text>
  <text x="256" y="136" fill="#ECEFF1" font-size="11">• Built via LShape[4]^4</text>
  <text x="256" y="156" fill="#ECEFF1" font-size="11">• 9 = Five in a row</text>
  <text x="256" y="176" fill="#ECEFF1" font-size="11">• 8 = Open Four (_OOOO_)</text>
  <text x="256" y="196" fill="#ECEFF1" font-size="11">• 7 = Half-Open Four</text>
  <text x="256" y="216" fill="#ECEFF1" font-size="11">• 6 = Open Three (_OOO_)</text>

  <!-- Stage 3 -->
  <rect x="456" y="64" width="180" height="190" rx="8" fill="#1E2930" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="546" y="88" text-anchor="middle" fill="#FFB74D" font-size="14" font-weight="700">3. STATUS4[10^4]</text>
  <text x="546" y="108" text-anchor="middle" fill="#B0BEC5" font-size="11">4D Composite Threat</text>
  <text x="470" y="136" fill="#ECEFF1" font-size="11">• A (8): Five-in-a-row</text>
  <text x="470" y="156" fill="#ECEFF1" font-size="11">• B (7): Open 4 or 4×4</text>
  <text x="470" y="176" fill="#ECEFF1" font-size="11">• C (6): 4×3 Fork</text>
  <text x="470" y="196" fill="#ECEFF1" font-size="11">• D/E: 4 + 2 / Half 4</text>
  <text x="470" y="216" fill="#ECEFF1" font-size="11">• F (3): 3×3 Fork</text>

  <!-- Stage 4 -->
  <rect x="670" y="64" width="162" height="190" rx="8" fill="#1E2930" stroke="#E57373" stroke-width="1.5"/>
  <text x="751" y="88" text-anchor="middle" fill="#E57373" font-size="14" font-weight="700">4. CheckForbid &amp; NSt</text>
  <text x="751" y="108" text-anchor="middle" fill="#B0BEC5" font-size="11">Global Threat Counts</text>
  <text x="684" y="136" fill="#ECEFF1" font-size="11">• Renju fouls (3×3,</text>
  <text x="694" y="152" fill="#ECEFF1" font-size="11">4×4, 6+) → FORBID (9)</text>
  <text x="684" y="178" fill="#ECEFF1" font-size="11">• NSt[2, 10] tracks live</text>
  <text x="694" y="194" fill="#ECEFF1" font-size="11">board threat counts</text>
  <text x="684" y="220" fill="#81C784" font-size="11">• Feeds QuickWinSearch</text>

  <line x1="208" y1="159" x2="240" y2="159" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="422" y1="159" x2="454" y2="159" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="636" y1="159" x2="668" y2="159" stroke="#4FC3F7" stroke-width="2" marker-end="url(#arr)"/>
</svg>

