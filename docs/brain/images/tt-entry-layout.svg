<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="820" height="280" rx="12" fill="#14191D" stroke="#2B3842" stroke-width="2"/>
  <text x="410" y="32" text-anchor="middle" fill="#ECEFF1" font-size="18" font-weight="700">16-Byte Aligned TranspositionEntry Memory Layout</text>

  <!-- Byte scale 0..15 -->
  <g transform="translate(50, 60)">
    <!-- Key: 8 bytes (0..7) -->
    <rect x="0" y="0" width="360" height="70" rx="6" fill="#1565C0" stroke="#42A5F5" stroke-width="2"/>
    <text x="180" y="30" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">ulong Key</text>
    <text x="180" y="52" text-anchor="middle" fill="#BBDEFB" font-size="12">8 Bytes (Offset 0..7) • Full 64-bit Zobrist Hash</text>

    <!-- Score: 2 bytes (8..9) -->
    <rect x="366" y="0" width="100" height="70" rx="6" fill="#2E7D32" stroke="#66BB6A" stroke-width="2"/>
    <text x="416" y="30" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">short Score</text>
    <text x="416" y="52" text-anchor="middle" fill="#C8E6C9" font-size="11">2 Bytes (8..9)</text>

    <!-- Depth: 1 byte (10) -->
    <rect x="472" y="0" width="60" height="70" rx="6" fill="#E65100" stroke="#FFA726" stroke-width="2"/>
    <text x="502" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Depth</text>
    <text x="502" y="52" text-anchor="middle" fill="#FFE0B2" font-size="10">1 B (10)</text>

    <!-- BoundAndAge: 1 byte (11) -->
    <rect x="538" y="0" width="80" height="70" rx="6" fill="#6A1B9A" stroke="#BA68C8" stroke-width="2"/>
    <text x="578" y="24" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">Bound/Age</text>
    <text x="578" y="42" text-anchor="middle" fill="#E1BEE7" font-size="10">b0..1: Bound</text>
    <text x="578" y="58" text-anchor="middle" fill="#E1BEE7" font-size="10">b2..7: Age</text>

    <!-- BestX: 1 byte (12) -->
    <rect x="624" y="0" width="46" height="70" rx="6" fill="#00838F" stroke="#26C6DA" stroke-width="2"/>
    <text x="647" y="30" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">BestX</text>
    <text x="647" y="52" text-anchor="middle" fill="#B2EBF2" font-size="10">1 B</text>

    <!-- BestY: 1 byte (13) -->
    <rect x="674" y="0" width="46" height="70" rx="6" fill="#00838F" stroke="#26C6DA" stroke-width="2"/>
    <text x="697" y="30" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">BestY</text>
    <text x="697" y="52" text-anchor="middle" fill="#B2EBF2" font-size="10">1 B</text>

    <!-- Padding: 2 bytes (14..15) -->
    <rect x="724" y="0" width="46" height="70" rx="6" fill="#37474F" stroke="#78909C" stroke-width="2"/>
    <text x="747" y="30" text-anchor="middle" fill="#CFD8DC" font-size="11" font-weight="600">Pad</text>
    <text x="747" y="52" text-anchor="middle" fill="#90A4AE" font-size="10">2 B</text>
  </g>

  <!-- Explanation footer -->
  <g transform="translate(50, 150)">
    <rect width="720" height="105" rx="8" fill="#1C2329" stroke="#37474F"/>
    <text x="20" y="26" fill="#4FC3F7" font-size="13" font-weight="700">Key Features of the 16-Byte Compact Layout:</text>
    <text x="20" y="50" fill="#CFD8DC" font-size="12">• Exactly 4 entries fit into a standard 64-byte L1 CPU cache line (Zero cache-line splitting).</text>
    <text x="20" y="70" fill="#CFD8DC" font-size="12">• Power-of-two table size (e.g. 1,048,576 entries = 16 MiB) allows instant masking: index = key &amp; mask.</text>
    <text x="20" y="90" fill="#CFD8DC" font-size="12">• BestMove coordinate packing (BestX, BestY in 1 byte each) avoids heap allocation or struct indirection.</text>
  </g>
</svg>

