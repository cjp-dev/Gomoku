<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <defs>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCFA4" />
      <stop offset="50%" stop-color="#DEB881" />
      <stop offset="100%" stop-color="#CF9F65" />
    </linearGradient>
    <radialGradient id="black-stone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="40%" stop-color="#262626" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <radialGradient id="white-stone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F1F1" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </radialGradient>
    <filter id="stone-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Main Window Background (Light Parchment Theme) -->
  <rect width="900" height="530" rx="12" fill="#FFFDF8" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Menu Bar -->
  <rect x="18" y="14" width="864" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  <text x="34" y="36" fill="#0F172A" font-size="13" font-weight="600" letter-spacing="0.3">Game     View     Options     Help</text>
  <text x="866" y="36" text-anchor="end" fill="#64748B" font-size="12">Gomoku .NET • Modern Light Theme</text>

  <!-- ==================== DUAL-CARD SCOREBOARD ==================== -->
  <g transform="translate(0, 56)">
    <!-- Black Player Card (Active Turn Highlight) -->
    <rect x="18" y="0" width="272" height="74" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#card-shadow)" />
    <circle cx="44" cy="26" r="11" fill="url(#black-stone)" filter="url(#stone-shadow)" />
    <text x="64" y="30" fill="#0F172A" font-size="14" font-weight="700">BLACK</text>
    <text x="118" y="30" fill="#64748B" font-size="12">(You)</text>
    <rect x="168" y="16" width="108" height="18" rx="4" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="222" y="29" text-anchor="middle" fill="#2563EB" font-size="10" font-weight="700">ACTIVE TURN</text>
    <text x="28" y="56" fill="#64748B" font-size="12">Role: <tspan fill="#0F172A" font-weight="600">Human</tspan></text>
    <text x="126" y="56" fill="#64748B" font-size="12">Time: <tspan fill="#0F172A" font-weight="700" font-family="Consolas, monospace">04:52</tspan></text>
    <text x="222" y="56" fill="#64748B" font-size="12">Last: <tspan fill="#0F172A" font-weight="600">H8</tspan></text>

    <!-- Center Turn Banner -->
    <rect x="306" y="0" width="288" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
    <text x="450" y="28" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="800" letter-spacing="0.5">MOVE #4</text>
    <circle cx="395" cy="49" r="4" fill="#2563EB" />
    <text x="450" y="53" text-anchor="middle" fill="#2563EB" font-size="12" font-weight="600">Black to move (Clocks active)</text>

    <!-- White Player Card (Computer) -->
    <rect x="610" y="0" width="272" height="74" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
    <circle cx="636" cy="26" r="11" fill="url(#white-stone)" stroke="#D4D4D8" stroke-width="1" filter="url(#stone-shadow)" />
    <text x="656" y="30" fill="#0F172A" font-size="14" font-weight="700">WHITE</text>
    <text x="712" y="30" fill="#64748B" font-size="12">(Computer)</text>
    <text x="620" y="56" fill="#64748B" font-size="12">Role: <tspan fill="#0F172A" font-weight="600">Carbon AI</tspan></text>
    <text x="734" y="56" fill="#64748B" font-size="12">Time: <tspan fill="#0F172A" font-weight="700" font-family="Consolas, monospace">04:55</tspan></text>
    <text x="826" y="56" fill="#64748B" font-size="12">Last: <tspan fill="#0F172A" font-weight="600">I8</tspan></text>
  </g>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <!-- Left Board Card -->
  <rect x="18" y="142" width="576" height="372" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
  
  <!-- Kaya Wood Board Surface -->
  <rect x="42" y="158" width="528" height="324" rx="6" fill="url(#wood-grad)" stroke="#8C5824" stroke-width="4" filter="url(#stone-shadow)" />

  <!-- Board Title & Dimension Label -->
  <text x="306" y="180" text-anchor="middle" fill="#452309" font-size="12" font-weight="700" letter-spacing="0.5">15×15 / 19×19 / 20×20 Kaya Wood Board</text>

  <!-- Grid Lines (Illustrated Gomoku Board Center) -->
  <g stroke="#713F12" stroke-width="1" stroke-opacity="0.65">
    <!-- Horizontal lines -->
    <line x1="90" y1="210" x2="522" y2="210" />
    <line x1="90" y1="242" x2="522" y2="242" />
    <line x1="90" y1="274" x2="522" y2="274" />
    <line x1="90" y1="306" x2="522" y2="306" />
    <line x1="90" y1="338" x2="522" y2="338" />
    <line x1="90" y1="370" x2="522" y2="370" />
    <line x1="90" y1="402" x2="522" y2="402" />

    <!-- Vertical lines -->
    <line x1="140" y1="200" x2="140" y2="412" />
    <line x1="184" y1="200" x2="184" y2="412" />
    <line x1="228" y1="200" x2="228" y2="412" />
    <line x1="272" y1="200" x2="272" y2="412" />
    <line x1="316" y1="200" x2="316" y2="412" />
    <line x1="360" y1="200" x2="360" y2="412" />
    <line x1="404" y1="200" x2="404" y2="412" />
    <line x1="448" y1="200" x2="448" y2="412" />
  </g>

  <!-- Star Points (Hoshi) -->
  <circle cx="184" cy="242" r="3.5" fill="#452309" />
  <circle cx="404" cy="242" r="3.5" fill="#452309" />
  <circle cx="316" cy="306" r="3.5" fill="#452309" />
  <circle cx="184" cy="370" r="3.5" fill="#452309" />
  <circle cx="404" cy="370" r="3.5" fill="#452309" />

  <!-- Coordinates Labels (Perimeter) -->
  <g fill="#713F12" font-size="10" font-family="Consolas, monospace" font-weight="600" opacity="0.8">
    <text x="228" y="196" text-anchor="middle">F</text>
    <text x="272" y="196" text-anchor="middle">G</text>
    <text x="316" y="196" text-anchor="middle">H</text>
    <text x="360" y="196" text-anchor="middle">I</text>
    <text x="404" y="196" text-anchor="middle">J</text>

    <text x="126" y="278" text-anchor="middle">9</text>
    <text x="126" y="310" text-anchor="middle">8</text>
    <text x="126" y="342" text-anchor="middle">7</text>
  </g>

  <!-- Placed Stones on Board -->
  <!-- Move 1: Black H8 -->
  <circle cx="316" cy="306" r="14" fill="url(#black-stone)" filter="url(#stone-shadow)" />
  
  <!-- Move 2: White I8 (with Red Last Move Marker) -->
  <circle cx="360" cy="306" r="14" fill="url(#white-stone)" stroke="#CBD5E1" stroke-width="1" filter="url(#stone-shadow)" />
  <circle cx="360" cy="306" r="3.5" fill="#DC2626" />

  <!-- Move 3: Black H9 -->
  <circle cx="316" cy="274" r="14" fill="url(#black-stone)" filter="url(#stone-shadow)" />

  <!-- Ghost Stone Preview on Hover (Semi-transparent Black at J8) -->
  <circle cx="404" cy="306" r="14" fill="#000000" fill-opacity="0.28" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Renju Foul Marker (Crimson Cross at G8) -->
  <g stroke="#DC2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="264" y1="298" x2="280" y2="314" />
    <line x1="280" y1="298" x2="264" y2="314" />
  </g>

  <!-- Interactive Board Feature Labels (Legend at bottom of board card) -->
  <text x="306" y="500" text-anchor="middle" fill="#475569" font-size="11">
    <tspan font-weight="600" fill="#713F12">Star Points</tspan>  •  
    <tspan font-weight="600" fill="#2563EB">Ghost Preview</tspan>  •  
    <tspan font-weight="600" fill="#DC2626">Last Move Dot</tspan>  •  
    <tspan font-weight="700" fill="#DC2626">Renju Foul (✕)</tspan>  •  
    <tspan font-weight="600" fill="#0F172A">Coordinates</tspan>
  </text>

  <!-- ==================== RIGHT SIDEBAR: REAL-TIME AI ANALYSIS ==================== -->
  <g transform="translate(610, 142)">
    <rect width="272" height="372" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#card-shadow)" />
    
    <!-- Panel Header -->
    <path d="M 0 8 Q 0 0 8 0 L 264 0 Q 272 0 272 8 L 272 38 L 0 38 Z" fill="#F8FAFC" />
    <line x1="0" y1="38" x2="272" y2="38" stroke="#E2E8F0" stroke-width="1" />
    <text x="16" y="24" fill="#0F172A" font-size="13" font-weight="700" letter-spacing="0.4">AI ANALYSIS</text>
    <rect x="206" y="10" width="50" height="18" rx="4" fill="#ECFDF5" stroke="#A7F3D0" />
    <text x="231" y="23" text-anchor="middle" fill="#059669" font-size="10" font-weight="700">LIVE</text>

    <!-- Telemetry Key-Value Rows -->
    <g font-size="12">
      <!-- Move Row -->
      <text x="16" y="66" fill="#64748B">Move:</text>
      <text x="256" y="66" text-anchor="end" fill="#0F172A" font-weight="600">#4</text>
      <line x1="16" y1="77" x2="256" y2="77" stroke="#F1F5F9" stroke-width="1" />

      <!-- Depth Row (Searching State) -->
      <text x="16" y="99" fill="#64748B">Depth:</text>
      <text x="256" y="99" text-anchor="end" fill="#2563EB" font-weight="700">8 plies...</text>
      <line x1="16" y1="110" x2="256" y2="110" stroke="#F1F5F9" stroke-width="1" />

      <!-- Score Row (Centipawn Advantage) -->
      <text x="16" y="132" fill="#64748B">Score:</text>
      <text x="256" y="132" text-anchor="end" fill="#B45309" font-weight="700">+45</text>
      <line x1="16" y1="143" x2="256" y2="143" stroke="#F1F5F9" stroke-width="1" />

      <!-- Best Move Row -->
      <text x="16" y="165" fill="#64748B">Best move:</text>
      <text x="256" y="165" text-anchor="end" fill="#0284C7" font-weight="700" font-family="Consolas, monospace">H9</text>
      <line x1="16" y1="176" x2="256" y2="176" stroke="#F1F5F9" stroke-width="1" />

      <!-- Nodes Row -->
      <text x="16" y="198" fill="#64748B">Nodes:</text>
      <text x="256" y="198" text-anchor="end" fill="#0F172A" font-family="Consolas, monospace">142,850</text>
      <line x1="16" y1="209" x2="256" y2="209" stroke="#F1F5F9" stroke-width="1" />

      <!-- Speed Row -->
      <text x="16" y="231" fill="#64748B">Speed:</text>
      <text x="256" y="231" text-anchor="end" fill="#0F172A" font-family="Consolas, monospace">785,000 nps</text>
      <line x1="16" y1="242" x2="256" y2="242" stroke="#F1F5F9" stroke-width="1" />

      <!-- Time Row -->
      <text x="16" y="264" fill="#64748B">Time:</text>
      <text x="256" y="264" text-anchor="end" fill="#0F172A" font-family="Consolas, monospace">0.62s</text>
      <line x1="16" y1="275" x2="256" y2="275" stroke="#F1F5F9" stroke-width="1" />

      <!-- Status Row -->
      <text x="16" y="297" fill="#64748B">Status:</text>
      <text x="256" y="297" text-anchor="end" fill="#059669" font-weight="700">Searching...</text>
    </g>

    <!-- Engine Architecture Badge Container -->
    <rect x="14" y="318" width="244" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="136" y="335" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="700">Engine: Carbon AI (Advanced)</text>
    <text x="136" y="350" text-anchor="middle" fill="#64748B" font-size="10">Iterative Deepening • VCF QuickWin • TT</text>
  </g>
</svg>
