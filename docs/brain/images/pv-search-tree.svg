<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="820" height="350" rx="12" fill="#141A1D" stroke="#2E3B43" stroke-width="2"/>
  <text x="410" y="32" text-anchor="middle" fill="#ECEFF1" font-size="18" font-weight="700">Closed-Interval Alpha-Beta Search &amp; QuickWinSearch VCF Solver</text>

  <!-- Node flow -->
  <rect x="40" y="60" width="220" height="72" rx="8" fill="#1E3448" stroke="#42A5F5" stroke-width="1.5"/>
  <text x="150" y="84" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Minimax(h, root, α, β)</text>
  <text x="150" y="104" text-anchor="middle" fill="#BBDEFB" font-size="11">Closed interval [α, β]</text>
  <text x="150" y="120" text-anchor="middle" fill="#90CAF9" font-size="11">best = α − 1; cutoff if value &gt; β</text>

  <rect x="300" y="60" width="220" height="72" rx="8" fill="#26392F" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="410" y="84" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">QuickWinSearch() VCF</text>
  <text x="410" y="104" text-anchor="middle" fill="#C8E6C9" font-size="11">Checks NSt[who/opp, A..F]</text>
  <text x="410" y="120" text-anchor="middle" fill="#A5D6A7" font-size="11">Solves forced 4/4×3 wins in O(1)</text>

  <rect x="560" y="60" width="220" height="72" rx="8" fill="#3B2A1E" stroke="#FFA726" stroke-width="1.5"/>
  <text x="670" y="84" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Zobrist TT Probe</text>
  <text x="670" y="104" text-anchor="middle" fill="#FFE0B2" font-size="11">Depth ≥ h &amp; same parity (d^h)&amp;1==0</text>
  <text x="670" y="120" text-anchor="middle" fill="#FFCC80" font-size="11">or mate score |v| ≥ WIN_MIN</text>

  <!-- Lower boxes -->
  <rect x="80" y="176" width="310" height="140" rx="8" fill="#1F2933" stroke="#AB47BC" stroke-width="1.5"/>
  <text x="235" y="200" text-anchor="middle" fill="#CE93D8" font-size="14" font-weight="700">GenerateCand &amp; ONE_CAND Pruning</text>
  <text x="98" y="224" fill="#ECEFF1" font-size="11">1. Place TT BestMove first (priority = 10000).</text>
  <text x="98" y="244" fill="#ECEFF1" font-size="11">2. Score 2-ring candidates via Prior[256][256].</text>
  <text x="98" y="264" fill="#ECEFF1" font-size="11">3. ONE_CAND: if Threat A or own Threat B exists,</text>
  <text x="110" y="280" fill="#ECEFF1" font-size="11">prune branching factor to 1 forced move.</text>
  <text x="98" y="300" fill="#ECEFF1" font-size="11">4. If opp Threat B exists, filter to threats ≥ E.</text>

  <rect x="430" y="176" width="350" height="140" rx="8" fill="#1F2933" stroke="#26C6DA" stroke-width="1.5"/>
  <text x="605" y="200" text-anchor="middle" fill="#80DEEA" font-size="14" font-weight="700">Narrowed Child Window &amp; Mate Distance</text>
  <text x="448" y="224" fill="#ECEFF1" font-size="11">• vA = −β,  vB = −(best.Value + 1)</text>
  <text x="448" y="244" fill="#ECEFF1" font-size="11">• Mate window stretch: if vB ≥ WIN_MIN → vB++</text>
  <text x="448" y="264" fill="#ECEFF1" font-size="11">• Mate distance decay: if value ≥ WIN_MIN → value−−</text>
  <text x="448" y="284" fill="#ECEFF1" font-size="11">• Prefers shortest mate in k plies over k+1 plies</text>
  <text x="448" y="304" fill="#ECEFF1" font-size="11">• Stores Exact / LowerBound / UpperBound in TT</text>
</svg>

